# cargo-deny: licences, security advisories, banned and duplicate crates, crate sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Only on Linux, through Tauri's GTK tray stack (gtk-rs 0.18 → glib-macros). A compile-time
    # macro marked unmaintained, not a vulnerability. Revisit when Tauri moves off gtk-rs 0.18.
    { id = "RUSTSEC-2024-0370", reason = "Linux-only via Tauri GTK; unmaintained proc macro, no vulnerability" },
    # Font parsing inside PDFs (pdf-extract → lopdf → ttf-parser). Marked unmaintained in 2026, no
    # known vulnerability; safe Rust. Revisit when lopdf moves to skrifa, or swap the PDF reader.
    { id = "RUSTSEC-2026-0192", reason = "PDF text extraction via lopdf; unmaintained notice, no vulnerability" },
    # zip 8.x, brought in only by calamine, docx-rs and umya-spreadsheet (all at their newest, all
    # still on zip ^8.6). The three advisories are about extracting archives to disk (`extract()`:
    # links escaping the folder, Unix setuid/permission bits). Those libraries only read Office
    # files in memory; Thrall's own code is on zip 9 and its archive tool unpacks entry by entry
    # with its own checks. Revisit when the three libraries move to zip 9.
    { id = "RUSTSEC-2026-0367", reason = "zip 8 only via Office libraries reading in memory; no extract() to disk" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8 only via Office libraries reading in memory; no extract() to disk" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8 only via Office libraries reading in memory; no extract() to disk" },
    # Only on Linux, through zbus 5 (keyring's secret-service and notify-rust). zbus's helper crates
    # (zvariant, zvariant_derive, zbus_names) are marked unmaintained, not vulnerable; no newer zbus
    # drops them yet. Revisit when keyring / notify-rust move off zbus 5.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: Linux-only via zbus; unmaintained notice, no vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: Linux-only via zbus; unmaintained notice, no vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: Linux-only via zbus; unmaintained notice, no vulnerability" },
]

[licenses]
version = 2
# Everything shipped must be compatible with MIT OR Apache-2.0 distribution: no GPL/AGPL.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    # Boost: permissive (keep the notice), used by arboard's Windows clipboard code.
    "BSL-1.0",
]
confidence-threshold = 0.9
# The allow-list is a policy, not an inventory: unused entries are fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Thrall's own crates reference each other by path; none are published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
